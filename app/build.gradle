plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.zhihushell'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.zhihushell'
        minSdk 23
        targetSdk 35
        versionCode 34
        versionName '1.34'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
